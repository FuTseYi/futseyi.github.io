name: Publish website
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - PREVIEW.md
      - BLOG_GUIDELINES.md
      - tests/**
      - .github/workflows/validate.yml
  workflow_dispatch:
  schedule:
    # Days 1 and 15 of each month, 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 1,15 * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a release after one host has published but before the other has.
concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERCEL_ORG_ID: team_l1CqVSExJqVueeH1BnT31FJc
      VERCEL_PROJECT_ID: prj_Qg2vq1riD7FVsCF1V6JuJAy7h2rp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify publishing credentials before changing either website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set the VERCEL_TOKEN secret in the github-pages environment before enabling dual publication."
            exit 1
          fi
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Check generators and source
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: Build and verify website once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python preview.py --build-only --refresh-activity
          python -c "import json; from pathlib import Path; assert json.loads(Path('_site/contributions.json').read_text(encoding='utf-8'))['entries'], 'No public contributions generated'"
      - name: Adapt the same static output for Vercel
        run: |
          mkdir -p .vercel/output/static
          cp -a _site/. .vercel/output/static/
          printf '{"version":3}\n' > .vercel/output/config.json
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          diff -qr _site .vercel/output/static
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.12.1
      - name: Stage Vercel production without changing the public domain
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --skip-domain --yes)"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Promote the same prebuilt Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL"
