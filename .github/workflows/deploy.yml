name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal Markdown renderer
        run: python -m pip install "Markdown>=3.7,<4"
      - name: Build Writing archive
        run: python .github/scripts/build.py
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -r assets blog _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/blog/index.html
          test -s _site/blog/posts.json
          test -s _site/sitemap.xml
      - name: Render latest posts on homepage
        run: python .github/scripts/sync_readme.py --update-site
      - name: Verify local links, blog pages and sitemap
        run: python .github/scripts/verify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
