name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Days 1 and 15 of each month, 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 1,15 * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify preview, README, and public activity helpers
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build Blog archive
        run: python .github/scripts/build.py
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -r assets blog _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/blog/index.html
          test -s _site/blog/posts.json
          test -s _site/sitemap.xml
      - name: Render latest posts on homepage
        run: python .github/scripts/sync_readme.py --update-site
      - name: Render public contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_activity.py --refresh
      - name: Index articles for search
        run: python -m pagefind --site _site --force-language zh
      - name: Verify local links, blog pages and sitemap
        run: python .github/scripts/verify.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
