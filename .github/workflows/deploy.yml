name: Publish website
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - PREVIEW.md
      - BLOG_GUIDELINES.md
      - tests/**
      - .github/workflows/validate.yml
  workflow_dispatch:
  schedule:
    # Days 1 and 15 of each month, 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 1,15 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify preview, README, and public activity helpers
        run: |
          python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: Bootstrap or refresh canonical contribution data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || ! -f contributions.json ]]; then
            python scripts/sync_activity.py --write-source
            if [[ -n "$(git status --porcelain -- contributions.json)" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add contributions.json
              git commit -m "data: update public GitHub contributions"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Build and verify complete website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python preview.py --build-only
          cmp contributions.json _site/contributions.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
