name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check preview, README, and activity helpers
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build and verify complete website
        run: python preview.py --build-only
