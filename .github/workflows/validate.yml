name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Check preview, README, and activity helpers
        run: |
          python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: Build and verify complete website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python preview.py --build-only --refresh-activity
      - name: Install browser regression tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium webkit
      - name: Test article layouts and navigation in Chromium and WebKit
        run: python tests/browser_smoke.py
