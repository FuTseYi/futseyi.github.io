name: Synchronize profile README
on:
  push:
    branches: [main]
    paths:
      - index.html
      - posts/**
      - scripts/blog_index.py
      - scripts/post_metadata.py
      - scripts/site_metadata.py
      - scripts/sync_readme.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      PROFILE_README_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Generate README from homepage and posts
        run: python scripts/sync_readme.py
      - name: Verify shared homepage and README content
        run: python -m unittest tests.test_sync_readme -v
      - name: Commit website README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync README from personal website"
            git push
          fi
      - name: Synchronize GitHub Profile README
        if: ${{ env.PROFILE_README_TOKEN != '' }}
        run: python scripts/sync_readme.py --sync-profile
      - name: Explain missing cross-repository authorization
        if: ${{ env.PROFILE_README_TOKEN == '' }}
        run: echo "::warning::Set the repository secret PROFILE_README_TOKEN (fine-grained token with FuTseYi/FuTseYi Contents write) to enable future automatic cross-repo synchronization."
